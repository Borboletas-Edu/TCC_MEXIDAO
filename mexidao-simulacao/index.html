<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mexidão · Simulação</title>
  <script src="nucleo/bloqueio.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23d27a33'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:wght@500;700;800&family=Inter:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos/app.css">
</head>
<body>
  <section class="bloqueio" aria-label="Bloqueado para visualização em celulares">
    <span class="bloqueio__icone" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="5" width="20" height="36" rx="4"/><path d="M20 35h6"/></svg>
      <span class="bloqueio__cadeado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
    </span>
    <h1 class="bloqueio__titulo">Bloqueado para visualização em celulares</h1>
    <p class="bloqueio__texto">Simulação criada e adaptada exclusivamente para visualização em desktop.</p>
    <p class="bloqueio__apoio">Copie o link abaixo e abra no navegador do computador.</p>
    <p class="bloqueio__link" data-link-pc></p>
    <button type="button" class="botao botao--principal" data-copiar-link><span class="botao__rotulo">Copiar link</span></button>
    <p class="bloqueio__copiado" data-copiado-pc role="status"></p>
  </section>
  <script>
    (function () {
      var url = location.href.split('#')[0];
      document.querySelector('[data-link-pc]').textContent = url;
      document.querySelector('[data-copiar-link]').addEventListener('click', function () {
        var aviso = document.querySelector('[data-copiado-pc]');
        var ok = function () { aviso.textContent = 'Link copiado!'; };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, function () { aviso.textContent = url; });
        else aviso.textContent = url;
      });
    })();
  </script>
  <main class="palco" aria-label="Simulação do app no celular">
    <div class="aparelho">
      <div class="aparelho__tela">
        <div class="status">
          <span class="status__hora">9:41</span>
          <span class="status__icones">
            <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
            <svg viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0ZM3.2 6.6a6.8 6.8 0 0 1 9.6 0l-1.4 1.4a4.8 4.8 0 0 0-6.8 0ZM.8 4.2a10.2 10.2 0 0 1 14.4 0L13.8 5.6a8.2 8.2 0 0 0-11.6 0Z" fill="currentColor"/></svg>
            <svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><path d="M24 4v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".4"/></svg>
          </span>
        </div>
        <div id="app"></div>
        <div class="indicador-home"></div>
      </div>
    </div>
  </main>
  <aside class="painel" id="painel" aria-label="Painel de apresentação"></aside>
  <script type="module" src="app.js"></script>
</body>
</html>
